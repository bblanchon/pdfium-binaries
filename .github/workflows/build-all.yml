  nuget:
    name: Build NuGet packages
    runs-on: windows-latest
    permissions:
      contents: read
      actions: write # Download/upload artifacts
      id-token: write  # OIDC token to log in to nuget.org
    needs:
      - android_arm
      - android_arm_v8
      - android_arm64
      - android_arm64_v8
      - android_x64
      - android_x64_v8
      - android_x86
      - android_x86_v8
      - ios_catalyst_arm64
      - ios_catalyst_arm64_v8
      - ios_catalyst_x64
      - ios_catalyst_x64_v8
      - ios_device_arm64
      - ios_device_arm64_v8
      - ios_simulator_arm64
      - ios_simulator_arm64_v8
      - ios_simulator_x64
      - ios_simulator_x64_v8
      - linux_arm
      - linux_arm_v8
      - linux_arm64
      - linux_arm64_v8
      - linux_x64
      - linux_x64_v8
      - linux_x86
      - linux_x86_v8
      - linux_musl_arm64
      - linux_musl_x64
      - linux_musl_x86
      - mac_arm64
      - mac_arm64_v8
      - mac_x64
      - mac_x64_v8
      - wasm
      - win_arm64
      - win_arm64_v8
      - win_x64
      - win_x64_v8
      - win_x86
      - win_x86_v8
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          path: nuget
      - name: Prepare header files
        shell: bash
        run: mkdir -p nuget/include/pdfium && cp -r nuget/pdfium-win-x86/include/* nuget/include/pdfium/
      - name: Define properties
        shell: bash
        run: |
          BRANCH="${GITHUB_REF#refs/heads/}"
          COMMIT="${GITHUB_SHA}"
          RELEASE_NOTES="$RELEASES_URL"
          $RELEASE && RELEASE_NOTES+="/tag/$BRANCH"
          echo "NUSPEC_PROPERTIES=version=$VERSION;branch=$BRANCH;commit=$COMMIT;releaseNotes=$RELEASE_NOTES" >> "$GITHUB_ENV"
        env:
          VERSION: ${{ github.event.inputs.version || '0.0.0.0' }}
          RELEASE: ${{ github.event.inputs.release }}
          BRANCH: ${{ github.event.inputs.branch }}
          RELEASES_URL: ${{ format('{0}/{1}/releases', github.server_url, github.repository) }}
      - name: Pack
        shell: bash
        run: |
          for NUSPEC in nuget/*.nuspec; do
            echo "::group::$NUSPEC"
            nuget pack "$NUSPEC" -p "$NUSPEC_PROPERTIES"
            echo "::endgroup::"
          done
      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: NuGet packages
          path: '*.nupkg'
      - name: Log in to nuget.org
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Push to nuget.org
        if: startsWith(github.event.inputs.branch, 'chromium/') && github.event.inputs.version && github.event.inputs.nuget == 'true'
        run: nuget push -Source nuget.org -ApiKey "$NUGET_API_KEY" *.nupkg
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}

  publish:
    name: Publish Release
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
      tagname: ${{ github.event.inputs.branch }}
    if: startsWith(github.event.inputs.branch, 'chromium/') && github.event.inputs.version && github.event.inputs.release == 'true'
    runs-on: ubuntu-latest
    needs:
      - android_arm
      - android_arm_v8
      - android_arm64
      - android_arm64_v8
      - android_x64
      - android_x64_v8
      - android_x86
      - android_x86_v8
      - ios_catalyst_arm64
      - ios_catalyst_arm64_v8
      - ios_catalyst_x64
      - ios_catalyst_x64_v8
      - ios_device_arm64
      - ios_device_arm64_v8
      - ios_simulator_x64
      - ios_simulator_x64_v8
      - linux_arm
      - linux_arm_v8
      - linux_arm64
      - linux_arm64_v8
      - linux_musl_arm64
      - linux_musl_x64
      - linux_musl_x86
      - linux_mipsel
      - linux_mips64el
      - linux_ppc64
      - linux_x64
      - linux_x64_v8
      - linux_x86
      - linux_x86_v8
      - mac_arm64
      - mac_arm64_v8
      - mac_univ
      - mac_univ_v8
      - mac_x64
      - mac_x64_v8
      - wasm
      - win_arm64
      - win_arm64_v8
      - win_x64
      - win_x64_v8
      - win_x86
      - win_x86_v8
    permissions:
      contents: write # to create releases
      id-token: write # to attest build provenance
      attestations: write # to attest build provenance
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v7
      - name: Create tarballs
        run: |
          for DIR in pdfium-*; do
            echo "::group::$DIR"
            (cd $DIR; tar czf ../$DIR.tgz *)
            echo "::endgroup::"
          done
      - name: Write release body
        run: echo "This version was built with branch \`$BRANCH\` of PDFium" > RELEASE.md
        env:
          BRANCH: ${{ github.event.inputs.branch }}
      - name: Get changes
        continue-on-error: true
        run: |
          CURRENT_REV=$BRANCH
          PREVIOUS_REV=$(curl --silent "$LATEST_RELEASE_URL" | jq -r ".tag_name")
          git clone -b "$BRANCH" https://pdfium.googlesource.com/pdfium.git
          cat <<END >> RELEASE.md
          ### Changes
          Commits between \`$PREVIOUS_REV\` and \`$CURRENT_REV\`:
          END
          git -C "pdfium" log origin/${PREVIOUS_REV}.. --pretty=format:'* [%s](https://pdfium.googlesource.com/pdfium/+/%H)' >> RELEASE.md
        env:
          BRANCH: ${{ github.event.inputs.branch }}
          LATEST_RELEASE_URL: ${{ format('{0}/repos/{1}/releases/latest', github.api_url, github.repository) }}
      - name: Generate artifacts checksums
        id: hash
        run: echo "hashes=$(sha256sum pdfium-*.tgz | base64 -w0)" >> "$GITHUB_OUTPUT"
      - name: Attest build provenance
        id: provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: pdfium-*.tgz
      - name: Rename provenance file
        run: mv "$BUNDLE_PATH" pdfium-attestation.json
        env:
          BUNDLE_PATH: ${{ steps.provenance.outputs.bundle-path }}
      - name: Publish Release
        run: |
          gh release create "$BRANCH" \
            pdfium-*.tgz \
            pdfium-attestation.json \
            --target "$GITHUB_SHA" \
            --title "PDFium $VERSION" \
            --notes-file RELEASE.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.inputs.branch }}
          VERSION: ${{ github.event.inputs.version }}
