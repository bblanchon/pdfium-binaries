name: Build all

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.inputs.branch }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      branch:
        description: PDFium branch
        required: false
        default: main
      version:
        description: PDFium version
        required: false
        default: ""
      enable_v8:
        description: Enable V8
        type: boolean
        required: false
        default: false
      is_debug:
        description: Is debug
        type: boolean
        required: false
        default: false
      release:
        description: Publish GitHub release
        type: boolean
        required: false
        default: false
      nuget:
        description: Publish on nuget.org
        type: boolean
        required: false
        default: false

jobs:
  android_arm:
    name: Android ARM
    permissions:
      contents: read
      actions: write # Upload workflow artifacts
    uses: ./.github/workflows/build.yml
    with:
      branch: ${{ github.event.inputs.branch }}
      version: ${{ github.event.inputs.version }}
      is_debug: ${{ github.event.inputs.is_debug == 'true' }}
      target_os: android
      target_cpu: arm
      enable_v8: false

  android_arm_v8:
    name: Android ARM V8
    if: github.event.inputs.enable_v8 == 'true'
    needs: android_arm
    permissions:
      contents: read
      actions: write # Upload workflow artifacts
    uses: ./.github/workflows/build.yml
    with:
      branch: ${{ github.event.inputs.branch }}
      version: ${{ github.event.inputs.version }}
      is_debug: ${{ github.event.inputs.is_debug == 'true' }}
      target_os: android
      target_cpu: arm
