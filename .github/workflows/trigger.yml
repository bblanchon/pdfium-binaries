name: Weekly schedule

on:
  schedule:
    - cron:  '0 4 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions: {}

jobs:
  trigger:
    name: Trigger build
    runs-on: ubuntu-latest
    permissions:
      actions: write # Trigger downstream workflow
    steps:
    - name: Get Chrome version
      id: chromium
      timeout-minutes: 5
      shell: bash
      run: |
        VERSION=$(git ls-remote --sort version:refname --tags https://chromium.googlesource.com/chromium/src '*.*.*.0' | grep -oE '[0-9]+\.[0-9]+\.[0-9]+.0' | tail -n1)
        BUILD=$(echo "$VERSION" | cut -d. -f3)
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "branch=chromium/$BUILD" >> $GITHUB_OUTPUT
    - name: Trigger build
      run: |
        gh workflow run "Build all" \
          --field branch="$BRANCH" \
          --field version="$VERSION" \
          --field is_debug=false \
          --field enable_v8=true \
          --field release=true \
          --field nuget=true
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        BRANCH: ${{ steps.chromium.outputs.branch }}
        VERSION: ${{ steps.chromium.outputs.version }}
